name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-merge:
    name: Validate Merge
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout PR
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        
    - name: Check for merge conflicts
      run: |
        git fetch origin ${{ github.base_ref }}
        if ! git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q '<<<<<<<'; then
          echo "✅ No merge conflicts detected"
        else
          echo "❌ Merge conflicts detected"
          exit 1
        fi

  test:
    name: Test (latest iOS runtime)
    runs-on: macos-26
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Verify Toolchain
      run: |
        xcodebuild -version | grep -F 'Xcode 26.6'
        xcrun swift --version | grep -F 'Apple Swift version 6.3'
        
    - name: Create iOS Simulator
      id: simulator
      run: echo "udid=$(bash .github/scripts/create-ios-simulator.sh)" >> "$GITHUB_OUTPUT"

    - name: Build and Test
      run: |
        xcodebuild test \
          -scheme DaVinci-Package \
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
          -enableCodeCoverage YES \
          -derivedDataPath .build

    - name: Upload Snapshot Failure Artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-failures
        path: .build/snapshot-failures/
        if-no-files-found: ignore
        retention-days: 14
        
    - name: Generate Code Coverage Report
      run: |
        xcrun xccov view --report .build/Logs/Test/*.xcresult > coverage.txt || echo "Coverage report generation skipped"
        
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.txt
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        
    - name: Install SwiftLint
      run: |
        brew install swiftlint
        
    - name: Run SwiftLint
      run: |
        swiftlint

  build-ios:
    name: Build (iOS 17 deployment)
    runs-on: macos-26
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Verify Toolchain
      run: |
        xcodebuild -version | grep -F 'Xcode 26.6'
        xcrun swift --version | grep -F 'Apple Swift version 6.3'
        
    - name: Build iOS Package
      run: |
        xcodebuild build \
          -scheme DaVinci-Package \
          -destination 'generic/platform=iOS Simulator' \
          IPHONEOS_DEPLOYMENT_TARGET=17.0 \
          -derivedDataPath .build
