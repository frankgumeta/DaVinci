name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Create Release
    runs-on: macos-26
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Verify Toolchain
      run: |
        xcodebuild -version | grep -F 'Xcode 26.6'
        xcrun swift --version | grep -F 'Apple Swift version 6.3'
        
    - name: Create iOS Simulator
      id: simulator
      run: echo "udid=$(bash .github/scripts/create-ios-simulator.sh)" >> "$GITHUB_OUTPUT"

    - name: Run Tests
      run: |
        xcodebuild test \
          -scheme DaVinci-Package \
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
          -enableCodeCoverage YES \
          -resultBundlePath .build/TestResults.xcresult \
          -derivedDataPath .build

    - name: Enforce Product Code Coverage
      run: |
        python3 .github/scripts/check-code-coverage.py \
          .build/TestResults.xcresult \
          --minimum DaVinciTokens=100 \
          --minimum DaVinciComponents=95
      
    - name: Build Package
      run: |
        xcodebuild build \
          -scheme DaVinci-Package \
          -destination 'generic/platform=iOS Simulator' \
          IPHONEOS_DEPLOYMENT_TARGET=17.0 \
          -derivedDataPath .build
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          LICENSE
          CHANGELOG.md
          README.md
          CONTRIBUTING.md
          ACCESSIBILITY.md
        generate_release_notes: true
        draft: false
        prerelease: false
