name: Release

on:
  push:
    tags:
      - 'v2.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DAVINCI_XCODE_VERSION: '27.0'
  DAVINCI_XCODE_BUILD: '27A266a'
  DAVINCI_SWIFT_VERSION: '6.4'

jobs:
  release:
    name: Create 2.x Release
    runs-on: xcode-27
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Validate release tag and ancestry
      id: release-metadata
      env:
        TAG_NAME: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        git fetch origin main --no-tags
        git merge-base --is-ancestor origin/main "$COMMIT_SHA"
        python3 .github/scripts/validate-release-tag.py "$TAG_NAME" \
          --github-output "$GITHUB_OUTPUT"

    - name: Verify Toolchain
      run: bash .github/scripts/verify-toolchain.sh

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --strict

    - name: Validate Package Contract
      run: python3 .github/scripts/check-package-contract.py

    - name: Test Coverage Reporter
      run: python3 -m unittest discover -s .github/scripts/tests -v

    - name: Validate Documentation Examples
      run: python3 .github/scripts/check-documentation.py
        
    - name: Create iOS Simulator
      id: simulator
      run: echo "udid=$(bash .github/scripts/create-ios-simulator.sh)" >> "$GITHUB_OUTPUT"

    - name: Run Tests
      run: |
        xcodebuild test \
          -scheme DaVinci-Package \
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
          -retry-tests-on-failure \
          -enableCodeCoverage YES \
          -resultBundlePath .build/TestResults.xcresult \
          -derivedDataPath .build

    - name: Enforce Product Code Coverage
      run: |
        python3 .github/scripts/check-code-coverage.py \
          .build/TestResults.xcresult \
          --minimum DaVinciTokens=100 \
          --minimum DaVinciComponents=95 \
          --minimum DaVinciGallery=60

    - name: Build Package and Previews
      run: |
        xcodebuild build \
          -scheme DaVinci-Package \
          -destination 'generic/platform=iOS Simulator' \
          IPHONEOS_DEPLOYMENT_TARGET=18.0 \
          ENABLE_PREVIEWS=YES \
          -derivedDataPath .build

    - name: Enforce Stable Public API Baseline
      run: bash .github/scripts/check-api-baseline.sh --check

    - name: Build API Documentation
      run: |
        xcodebuild docbuild \
          -scheme DaVinci-Package \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath .build
        python3 .github/scripts/check-documentation-diagnostics.py .build

    - name: Build External Consumer
      run: bash .github/scripts/check-external-consumer.sh
        
    - name: Delete Simulators
      if: always()
      run: |
        bash .github/scripts/delete-ios-simulator.sh '${{ steps.simulator.outputs.udid }}'

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          LICENSE
          CHANGELOG.md
          README.md
          CONTRIBUTING.md
          ACCESSIBILITY.md
          SECURITY.md
          ${{ steps.release-metadata.outputs.notes_path }}
        body_path: ${{ steps.release-metadata.outputs.notes_path }}
        generate_release_notes: false
        draft: true
        prerelease: ${{ steps.release-metadata.outputs.prerelease == 'true' }}
