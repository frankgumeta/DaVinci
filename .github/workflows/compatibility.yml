name: LTS Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DAVINCI_XCODE_VERSION: '27.0'
  DAVINCI_XCODE_BUILD: '27A266a'
  DAVINCI_SWIFT_VERSION: '6.4'

jobs:
  ios-17-runtime:
    name: Test on iOS 17 runtime
    runs-on: xcode-27

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Verify Toolchain
      run: bash .github/scripts/verify-toolchain.sh

    - name: Validate Package Contract
      run: python3 .github/scripts/check-package-contract.py

    - name: Install iOS 17.5 Simulator Runtime
      run: |
        if ! xcrun simctl list runtimes | grep -q 'iOS 17'; then
          xcodebuild -downloadPlatform iOS -buildVersion 17.5
        fi

    - name: Create iOS 17 Simulator
      id: simulator
      env:
        DAVINCI_IOS_RUNTIME_MAJOR: '17'
      run: echo "udid=$(bash .github/scripts/create-ios-simulator.sh)" >> "$GITHUB_OUTPUT"

    - name: Run Compatibility Suite on Minimum Runtime
      run: |
        bash .github/scripts/run-minimum-runtime-tests.sh \
          '${{ steps.simulator.outputs.udid }}' \
          .build/iOS17-TestResults.xcresult

    - name: Upload Compatibility Result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ios-17-compatibility-result
        path: .build/iOS17-TestResults.xcresult
        if-no-files-found: warn
        retention-days: 14

    - name: Delete iOS 17 Simulator
      if: always()
      run: bash .github/scripts/delete-ios-simulator.sh '${{ steps.simulator.outputs.udid }}'
